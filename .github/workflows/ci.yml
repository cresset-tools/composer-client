name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    # Pure-logic crates, but run the matrix anyway: the install-path routing and
    # deploy/autoload-discovery conformance suites should pass identically on
    # every platform.
    name: cargo test (${{ matrix.os }})
    # macos-latest runs on the self-hosted Mac mini for code from this repo;
    # fork PRs stay on GitHub's runner. Set the org variable
    # MAC_MINI_DISABLED=true to send everything back to GitHub.
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MAC_MINI_DISABLED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mac-mini"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-bin: false
      - run: cargo build --all-targets
      - run: cargo test

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
